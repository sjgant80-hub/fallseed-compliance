  // ─── State ──────────────────────────────────────────────────────────
  const MODALITIES = ['text', 'image', 'video', 'tts', 'stt'];
  const emptyKeys = () => ({ text: {}, image: {}, video: {}, tts: {}, stt: {} });
  /**
   * What a stored config holds, split into what may be stored (the tier, providers, models) and what is held in this
   * tab only (the keys). Keys stay stored only when the owner chose "remember my keys on this device"; a config written
   * the old way (keys stored, no choice made) has its keys moved into the tab and stored no longer. Pure.
   * → { config, secrets, moved } (moved: how many keys were taken out of storage)
   */
  function configFrom(c) {
    c = c && typeof c === 'object' && !Array.isArray(c) ? Object.assign({}, c) : {};
    if (c.api_key && !c.keys) {   // v1 → v2: one text key at the top level
      c.keys = emptyKeys();
      c.keys.text[c.api_provider || 'anthropic'] = { key: c.api_key, model: c.api_model };
    }
    delete c.api_key;
    const secrets = emptyKeys(), models = emptyKeys();
    let moved = 0;
    for (const m of MODALITIES) {
      const held = c.keys && c.keys[m] && typeof c.keys[m] === 'object' ? c.keys[m] : {};
      for (const pk of Object.keys(held)) {
        const e = held[pk] || {};
        if (typeof e.key === 'string' && e.key) { secrets[m][pk] = e.key; moved++; }
        if (typeof e.model === 'string' && e.model) models[m][pk] = e.model;
      }
      const kept = c.models && c.models[m] && typeof c.models[m] === 'object' ? c.models[m] : {};
      for (const pk of Object.keys(kept)) if (typeof kept[pk] === 'string' && kept[pk]) models[m][pk] = models[m][pk] || kept[pk];
    }
    c.models = models;
    const remember = c.remember_keys === true;
    if (!remember) delete c.keys;
    return { config: c, secrets: secrets, moved: remember ? 0 : moved };
  }
  /** what is written to storage: the config, with the keys only if the owner chose to remember them. Pure. */
  function storedForm(config, secrets) {
    const out = Object.assign({}, config);
    delete out.keys;
    if (config.remember_keys === true) {
      out.keys = emptyKeys();
      for (const m of MODALITIES) for (const pk of Object.keys(secrets[m] || {})) out.keys[m][pk] = { key: secrets[m][pk], model: (config.models && config.models[m] && config.models[m][pk]) || undefined };
    }
    return out;
  }

  // ═══════════════════════ TEXT · aiComplete · aiChat ═══════════════
  // One way to ask every text provider: the system prompt first and the same each call (so a provider can reuse its
  // reading of it), then the conversation, which only ever grows. Pure pieces (requestOf, textOf, usageOf) are exposed
  // on FallKit for tests; nothing pure here touches the network.
  const isObj = (x) => x !== null && typeof x === 'object' && !Array.isArray(x);
  const count = (x) => (Number.isInteger(x) && x >= 0 ? x : 0);
  /** Claude models from 5.x think before they answer: room for that, and a light effort for an assistant's reply */
  const THINKS = (model) => /^claude-(?:opus|sonnet|haiku|fable|mythos)-5/.test(model);
  /** Claude models with a server-side fallback when a request is declined (Haiku has none) */
  const FALLS_BACK = (model) => /^claude-(?:opus|sonnet|fable)-5/.test(model);
  /** a message's words, whatever shape a provider keeps it in */
  function wordsOf(m) {
    if (!isObj(m)) return '';
    if (typeof m.content === 'string') return m.content;
    if (Array.isArray(m.content)) return m.content.filter((b) => isObj(b) && b.type === 'text' && typeof b.text === 'string').map((b) => b.text).join('\n');
    return '';
  }
  /**
   * The request a text provider is sent: { url, headers, body } for type (anthropic | openai | google | openai_compat |
   * cohere | hf_inference). messages: [{ role: 'user' | 'assistant', content }]. Pure: the key is placed, never kept.
   */
  function requestOf(type, opts) {
    const { model, key, system, messages, maxTokens, url } = opts;
    const max = Number.isInteger(maxTokens) && maxTokens > 0 ? maxTokens : 600;
    const plain = messages.map((m) => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: wordsOf(m) }));
    if (type === 'anthropic') {
      const headers = { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' };
      const body = { model, max_tokens: THINKS(model) ? Math.max(max * 4, 4000) : max, system: [{ type: 'text', text: system, cache_control: { type: 'ephemeral' } }],
        messages: messages.map((m) => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content })) };
      if (THINKS(model)) body.output_config = { effort: 'low' };
      if (FALLS_BACK(model)) { headers['anthropic-beta'] = 'server-side-fallback-2026-07-01'; body.fallbacks = 'default'; }
      return { url: 'https://api.anthropic.com/v1/messages', headers, body };
    }
    if (type === 'openai') return { url: 'https://api.openai.com/v1/chat/completions', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_completion_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    if (type === 'google') return { url: 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent', headers: { 'content-type': 'application/json', 'x-goog-api-key': key },
      body: { systemInstruction: { parts: [{ text: system }] }, contents: plain.map((m) => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] })), generationConfig: { maxOutputTokens: max } } };
    if (type === 'cohere') return { url: 'https://api.cohere.com/v2/chat', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    if (type === 'hf_inference') return { url: 'https://api-inference.huggingface.co/models/' + model + '/v1/chat/completions', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    if (type === 'openai_compat') return { url: url, headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    return null;
  }
  /** the answer's words from a provider's reply, or null when it declined or said nothing. Pure. */
  function textOf(type, j) {
    if (!isObj(j)) return null;
    let t = '';
    if (type === 'anthropic') { if (j.stop_reason === 'refusal' || !Array.isArray(j.content)) return null; t = wordsOf({ content: j.content }); }
    else if (type === 'google') { const c = Array.isArray(j.candidates) ? j.candidates[0] : null; t = c && isObj(c.content) && Array.isArray(c.content.parts) ? c.content.parts.map((p) => (isObj(p) && typeof p.text === 'string' ? p.text : '')).join('') : ''; }
    else if (type === 'cohere') { t = isObj(j.message) && Array.isArray(j.message.content) ? wordsOf({ content: j.message.content.map((b) => Object.assign({ type: 'text' }, b)) }) : ''; }
    else { const c = Array.isArray(j.choices) ? j.choices[0] : null; t = c && isObj(c.message) && typeof c.message.content === 'string' ? c.message.content : ''; }
    t = t.trim();
    return t ? t : null;
  }
  /** what a call used, read from a provider's own usage record: { read, recycled, written, out }. Pure. */
  function usageOf(type, j) {
    const u = isObj(j) ? (type === 'google' ? j.usageMetadata : type === 'cohere' && isObj(j.usage) ? j.usage.tokens : j.usage) : null;
    if (!isObj(u)) return { read: 0, recycled: 0, written: 0, out: 0 };
    if (type === 'anthropic') { const recycled = count(u.cache_read_input_tokens), written = count(u.cache_creation_input_tokens); return { read: count(u.input_tokens) + recycled + written, recycled, written, out: count(u.output_tokens) }; }
    if (type === 'google') { const read = count(u.promptTokenCount); return { read, recycled: Math.min(read, count(u.cachedContentTokenCount)), written: 0, out: count(u.candidatesTokenCount) + count(u.thoughtsTokenCount) }; }
    if (type === 'cohere') return { read: count(u.input_tokens), recycled: 0, written: 0, out: count(u.output_tokens) };
    const read = count(u.prompt_tokens), d = isObj(u.prompt_tokens_details) ? u.prompt_tokens_details : {};
    return { read, recycled: Math.min(read, count(d.cached_tokens)), written: 0, out: count(u.completion_tokens) };
  }

  async function aiComplete(systemPrompt, userMsg, maxTokens) {
    const r = await aiChat(systemPrompt, [], userMsg, maxTokens);
    return r ? r.text : null;
  }
  /**
   * One turn of a conversation: the system prompt, the history so far (unchanged), and the user's words. → { text,
   * assistant } — the caller appends { role: 'user', content: userMsg } and `assistant` to its history (assistant is the
   * reply as the provider gave it, so a provider that checks its own earlier turns sees them unchanged) — or null when no
   * tier can answer.
   */
  async function aiChat(systemPrompt, history, userMsg, maxTokens) {
    maxTokens = maxTokens || 600;
    const messages = (Array.isArray(history) ? history : []).concat([{ role: 'user', content: String(userMsg == null ? '' : userMsg) }]);
    const tier = aiTier();
    if (tier === 'T2' && STATE.ai.ready && STATE.ai.engine) {
      const r = await STATE.ai.engine.chat.completions.create({
        messages: [{ role: 'system', content: systemPrompt }].concat(messages.map((m) => ({ role: m.role, content: wordsOf(m) }))), max_tokens: maxTokens,
      });
      const text = r.choices[0].message.content;
      STATE.lastUsage = Object.assign({ provider: 'webllm' }, usageOf('openai', r));
      return { text: text, assistant: { role: 'assistant', content: text } };
    }
    if (tier === 'T3') {
      const p = activeTextProvider(); const key = getKey('text', p);
      if (!key) return null;
      return await textCall(p, systemPrompt, messages, maxTokens);
    }
    return null;
  }

  async function textCall(providerKey, sys, messages, maxTokens) {
    const p = TEXT_PROVIDERS[providerKey];
    const model = getModel('text', providerKey, TEXT_PROVIDERS);
    const req = requestOf(p.type, { model, key: getKey('text', providerKey), system: sys, messages, maxTokens, url: p.url });
    if (!req) throw new Error('unknown text provider type: ' + p.type);
    const r = await fetch(req.url, { method: 'POST', headers: req.headers, body: JSON.stringify(req.body) });
    if (!r.ok) throw new Error(p.label + ' ' + r.status);
    const j = await r.json();
    STATE.lastUsage = Object.assign({ provider: providerKey, model: model }, usageOf(p.type, j));
    const text = textOf(p.type, j);
    if (text === null) return null;
    return { text: text, assistant: p.type === 'anthropic' ? { role: 'assistant', content: j.content } : { role: 'assistant', content: text } };
  }

  // ═══════════════════════ ASK · about this page ═════════════════════
  // The kit's own use of the brain, so the chip is useful in any build, wired or not: a question about the page, answered
  // from the page's own words. The opening is read once per talk and sent byte-identical every question, so a provider
  // that caches recycles it; a talk starts afresh after MAX_ASKS questions or when the person starts again.
  const PAGE_MAX = 12000, MAX_ASKS = 20;
  const ASK_OPENING = 'You are the helper inside a web page. Answer questions about this page and how to use it, briefly and in plain words. Use only what the page says below; when it does not say, say so.';
  /** the opening for questions about a page: who the helper is, then the page's title, description and text. Pure. */
  function pageOpening(page) {
    const p = isObj(page) ? page : {};
    const line = (s, n) => (typeof s === 'string' ? s : '').replace(/\s+/g, ' ').trim().slice(0, n);
    const text = (typeof p.text === 'string' ? p.text : '').replace(/[ \t\r\f\v]+/g, ' ').replace(/ *\n[\s]*/g, '\n').trim().slice(0, PAGE_MAX);
    const about = line(p.description, 400);
    return ASK_OPENING + '\n\nPAGE: ' + (line(p.title, 200) || '(no title)') + '\n' + (about ? 'ABOUT: ' + about + '\n' : '') + 'TEXT:\n' + text;
  }
  function readPage() {   // the page as its reader has it, without the kit's own chip, panel and code
    const d = document.querySelector('meta[name="description"]');
    const body = document.body ? document.body.cloneNode(true) : null;
    if (body) {
      body.querySelectorAll('#fk-modal-bg, #fk-ai-chip, #fk-toast, script, style, noscript, template').forEach((e) => e.remove());

  async function askPage(question) {
    const q = String(question == null ? '' : question).trim();
    if (!q) return { text: null, why: 'Type a question first.' };
    if (aiTier() === 'T0') return { text: null, why: 'AI is off. Pick T2 (a model in your browser) or T3 (your own key) below, press Save, then ask.' };
    const t = STATE.ask;
    if (!t.opening || t.talk.length >= MAX_ASKS * 2) { t.opening = pageOpening(readPage()); t.talk = []; }
    const r = await aiChat(t.opening, t.talk, q, 600);
    if (!r) return { text: null, why: aiTier() === 'T2' ? 'The in-browser model is not loaded yet: press Load model below.' : 'No key is set for this provider: add one below and press Save.' };

    t.last = r.text;
    return { text: r.text, why: null };
  }

  // ═══════════════════════ STT · aiSTT ═══════════════════════════════
  async function aiSTT(blob, opts) {
    opts = opts || {};
    const providerKey = opts.provider || STATE.config.stt_provider || 'deepgram';
    const p = STT_PROVIDERS[providerKey];
    const key = getKey('stt', providerKey);
    if (!key) return null;
    const model = opts.model || getModel('stt', providerKey, STT_PROVIDERS);

    if (p.type === 'deepgram') {
      const r = await fetch('https://api.deepgram.com/v1/listen?model=' + model + '&smart_format=true', {
        method: 'POST', headers: { 'Authorization': 'Token ' + key, 'content-type': blob.type || 'audio/wav' },
        body: blob,
      });
      if (!r.ok) throw new Error('Deepgram ' + r.status);
      const j = await r.json();
      return { text: j.results?.channels?.[0]?.alternatives?.[0]?.transcript, raw: j };
    }
    if (p.type === 'assemblyai') {
      const up = await fetch('https://api.assemblyai.com/v2/upload', { method: 'POST', headers: { 'Authorization': key }, body: blob });
      const upJ = await up.json();
      const r = await fetch('https://api.assemblyai.com/v2/transcript', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': key },
        body: JSON.stringify({ audio_url: upJ.upload_url, speech_model: model }),
      });
      if (!r.ok) throw new Error('AssemblyAI ' + r.status);
      const j = await r.json();
      return { id: j.id, raw: j, note: 'poll for text' };
    }
    if (p.type === 'openai_stt') {
      const fd = new FormData();
      fd.append('file', blob, 'audio.wav');
      fd.append('model', model);
      const r = await fetch('https://api.openai.com/v1/audio/transcriptions', {
        method: 'POST', headers: { 'Authorization': 'Bearer ' + key }, body: fd,
      });
      if (!r.ok) throw new Error('OpenAI Whisper ' + r.status);
      const j = await r.json();
      return { text: j.text, raw: j };
    }
    throw new Error('unknown STT provider type: ' + p.type);
  }

  // ─── WebRTC P2P mesh ────────────────────────────────────────────────
  const MESH_CHANNEL = 'fall-signal';
  function meshStart(opts) {
    if (STATE.mesh.active) return;
    opts = opts || {};
    const seedId = opts.seedId || (location.pathname + '#' + Math.random().toString(36).slice(2, 8));
    STATE.mesh.seedId = seedId;
    try { STATE.mesh.bc = new BroadcastChannel(MESH_CHANNEL); }
    catch (e) { console.warn('fall-kit: BroadcastChannel unavailable'); return; }
    STATE.mesh.bc.onmessage = e => {
      const m = e.data;
      if (!m || !m.kind || m.peerId === seedId) return;
      if (opts.onMessage) opts.onMessage(m);
    };
    STATE.mesh.bc.postMessage({ kind: 'fall-kit:hello', peerId: seedId, ts: Date.now(), seedName: opts.seedName || 'unknown' });
    STATE.mesh.active = true;
    notify('Mesh active · channel ' + MESH_CHANNEL, 'ok');
  }
  function meshPost(kind, payload) {
    if (!STATE.mesh.active || !STATE.mesh.bc) return false;
    STATE.mesh.bc.postMessage({ kind: kind, peerId: STATE.mesh.seedId, ts: Date.now(), payload: payload });
    return true;
  }

  // ─── Toast ──────────────────────────────────────────────────────────
  function notify(msg, kind) {
    let t = $('#fk-toast');
    if (!t) {
      t = document.createElement('div'); t.id = 'fk-toast';
      t.style.cssText = 'position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:#c08a3a;color:#0a0a0a;padding:9px 18px;border-radius:3px;font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:0;transition:all .22s;z-index:10000;pointer-events:none';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.background = kind === 'err' ? '#a14a2a' : kind === 'ok' ? '#6b8d4a' : '#c08a3a';
    t.style.color = kind === 'err' ? '#fff' : '#0a0a0a';
    t.style.opacity = '1';
    t.style.transform = 'translateX(-50%) translateY(0)';
    clearTimeout(t._to);
    t._to = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(20px)'; }, 2400);
  }

  // ─── The floating chip keeps clear of the build's own fixed bars and controls ─────────
  // A build's bottom tab bar or floating button stays put while the page scrolls, so a chip over it would hide it. The
  // chip looks at what is under it and moves up past it; a fixed container as tall as the page counts only by the
  // control under the chip. Content that scrolls is not in the way.
  function blockerUnder(el) {
    let fixed = null;
    for (let e = el; e && e !== document.body && e !== document.documentElement; e = e.parentElement) {
      const pos = getComputedStyle(e).position;
      if (pos === 'fixed' || pos === 'sticky') { fixed = e; break; }
    }
    if (!fixed) return null;
    if (fixed.getBoundingClientRect().height <= innerHeight * 0.4) return fixed;
    return el.closest('button, a, input, select, textarea, label, [role=button], [tabindex]');
  }
  function placeChip(chip) {
    if (!chip || chip.dataset.anchored) return;
    chip.style.top = ''; chip.style.bottom = '14px';
    for (let i = 0; i < 6; i++) {
      const r = chip.getBoundingClientRect();
      chip.style.visibility = 'hidden';
      const hit = [[r.left + 2, r.top + 2], [r.right - 2, r.top + 2], [r.left + 2, r.bottom - 2], [r.right - 2, r.bottom - 2]]
        .map(([x, y]) => document.elementFromPoint(x, y)).filter(Boolean).map(blockerUnder).find(Boolean);
      chip.style.visibility = '';
      if (!hit) return;
      const bottom = innerHeight - hit.getBoundingClientRect().top + 8;
      if (bottom > innerHeight * 0.6) { chip.style.bottom = ''; chip.style.top = '14px'; return; }
      chip.style.bottom = bottom + 'px';
    }
  }

const isObj = (v) => typeof v === 'object' && v !== null && !Array.isArray(v);

/**
 * Compute the posture over an array of control statuses (one per in-scope control). Unknown values
 * are treated as 'pending' (never trusted upward). 'na' controls are excluded from scope entirely.
 * coverage = met / in-scope; maturity = weighted / in-scope. Both are whole percents.
 */
function postureOf(statuses) {
  const arr = Array.isArray(statuses) ? statuses.map((s) => (STATUSES.includes(s) ? s : 'pending')) : [];
  const byStatus = {};
  for (const s of STATUSES) byStatus[s] = 0;
  for (const s of arr) byStatus[s] += 1;
  const total = arr.length;
  const na = byStatus.na;
  const inScope = total - na;
  const met = byStatus.implemented + byStatus.evidenced + byStatus.audited;
  const gapCount = inScope - met;
  let weightSum = 0;
  for (const s of arr) weightSum += (s === 'na' ? 0 : STATUS_WEIGHT[s]);
  const coveragePct = inScope === 0 ? 0 : Math.round((met / inScope) * 100);
  const maturityPct = inScope === 0 ? 0 : Math.round((weightSum / inScope) * 100);
  return { total, inScope, na, met, gapCount, coveragePct, maturityPct, byStatus };
}

const K256 = new Uint32Array([

function sha256(text) {
  if (!isStr(text)) return { ok: false, why: 'sha256 takes a string' };
  const data = new TextEncoder().encode(text);
  const len = data.length;
  const padded = new Uint8Array((((len + 8) >> 6) << 6) + 64);
  padded.set(data);
  padded[len] = 0x80;
  const dv = new DataView(padded.buffer);
  const bitLen = len * 8;
  dv.setUint32(padded.length - 8, Math.floor(bitLen / 4294967296));
  dv.setUint32(padded.length - 4, bitLen >>> 0);
  let h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a;
  let h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;
  const w = new Uint32Array(64);
  for (let i = 0; i < padded.length; i += 64) {
    for (let t = 0; t < 16; t++) w[t] = dv.getUint32(i + t * 4);
    for (let t = 16; t < 64; t++) {
      const x = w[t - 15], y = w[t - 2];
      const s0 = (((x >>> 7) | (x << 25)) ^ ((x >>> 18) | (x << 14)) ^ (x >>> 3)) >>> 0;
      const s1 = (((y >>> 17) | (y << 15)) ^ ((y >>> 19) | (y << 13)) ^ (y >>> 10)) >>> 0;
      w[t] = (w[t - 16] + s0 + w[t - 7] + s1) >>> 0;
    }
    let a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, hh = h7;
    for (let t = 0; t < 64; t++) {
      const S1 = (((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7))) >>> 0;
      const ch = ((e & f) ^ (~e & g)) >>> 0;
      const t1 = (hh + S1 + ch + K256[t] + w[t]) >>> 0;
      const S0 = (((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10))) >>> 0;
      const maj = ((a & b) ^ (a & c) ^ (b & c)) >>> 0;
      const t2 = (S0 + maj) >>> 0;
      hh = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0;
    h4 = (h4 + e) >>> 0; h5 = (h5 + f) >>> 0; h6 = (h6 + g) >>> 0; h7 = (h7 + hh) >>> 0;
  }
  const hex = (n) => n.toString(16).padStart(8, '0');
  return { ok: true, hash: hex(h0) + hex(h1) + hex(h2) + hex(h3) + hex(h4) + hex(h5) + hex(h6) + hex(h7) };
}

function canon(v) {
  if (v === null || typeof v === 'number' || typeof v === 'boolean') return JSON.stringify(v);
  if (typeof v === 'string') return JSON.stringify(v);
  if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
  if (typeof v === 'object') return '{' + Object.keys(v).sort().map((k) => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
  return '"?"';
}

/**
 * Seal a posture snapshot: the coverage + maturity + gap count, bound to a hash of the exact status
 * vector. The reported posture becomes tamper-evident — change one control's status or nudge a
 * number and the seal no longer matches.
 */
function sealPosture(statuses, meta) {
  const p = postureOf(statuses);
  const sh = sha256(canon(Array.isArray(statuses) ? statuses.map((s) => (STATUSES.includes(s) ? s : 'pending')) : []));
  const body = {
    v: 1, kind: 'posture-seal',
    inScope: p.inScope, met: p.met, gapCount: p.gapCount, coveragePct: p.coveragePct, maturityPct: p.maturityPct,
    statusesHash: sh.hash, at: (isObj(meta) && isStr(meta.at)) ? meta.at : null,
    scope: 'a deterministic posture over the in-scope controls — operational scaffolding, not a certification; an accredited audit body still decides',
  };
  const h = sha256(canon(body));
  return { ...body, hash: h.hash };
}

function verifyPosture(s) {
  if (!isObj(s) || !isStr(s.hash)) return { ok: false, why: 'a posture seal is an object with a hash' };
  if (s.kind !== 'posture-seal') return { ok: false, why: 'not a posture seal' };
  const body = { ...s };
  delete body.hash;
  const h = sha256(canon(body));
  if (!h.ok) return { ok: false, why: h.why };
  return { ok: true, valid: h.hash === s.hash };
}

  const h = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2,'0')).join('');

window.__fellowSeeds = window.__fellowSeeds || new Map();
let __sigChan = null, __meshChan2 = null, __pingTimer = null;

function __seedSelfInfo() {
  try {
    return {
      source: 'fallseed-' + (SEED.manifest.name || 'unknown'),
      name: SEED.manifest.name || 'unknown',
      prime: SEED.manifest.prime,
      version: SEED.manifest.version,
      level: SEED.manifest.level !== undefined ? SEED.manifest.level : null,
      parent: SEED.manifest.parent || null,
      mesh: SEED.manifest.meshChannel,
      ts: Date.now()
    };
  } catch (e) { return { source: 'fallseed-unknown', ts: Date.now() }; }
}

function __pruneFellowSeeds(maxAgeMs) {
  const cutoff = Date.now() - (maxAgeMs || 90000);
  for (const [k, v] of window.__fellowSeeds.entries()) {
    if (v.lastSeen < cutoff) window.__fellowSeeds.delete(k);
  }
}

function initMesh() {
  try {
    __sigChan = new BroadcastChannel('fall-signal');
    // Announce self
    __sigChan.postMessage({ type: 'hello', ...__seedSelfInfo() });
    // Listen for hellos + pings + replies
    __sigChan.onmessage = e => {
      const m = e.data || {};
      if (!m.type) return;
      if (m.type === 'hello' || m.type === 'pong') {
        if (!m.source || m.source === __seedSelfInfo().source) return;
        const existing = window.__fellowSeeds.get(m.source) || {};
        window.__fellowSeeds.set(m.source, { ...existing, ...m, lastSeen: Date.now() });
        // Trigger a re-render of inspect if visible
        if (typeof state !== 'undefined' && state.active === 'inspect') {
          if (typeof render === 'function') try { render(); } catch (e) {}
        }
      } else if (m.type === 'ping') {
        // Reply with our own info so the pinger can discover us
        try { __sigChan.postMessage({ type: 'pong', ...__seedSelfInfo() }); } catch (e) {}
      }
    };
    // Periodic ping to refresh peer list (every 30s)
    __pingTimer = setInterval(() => {
      try {
        __sigChan.postMessage({ type: 'ping', ...__seedSelfInfo() });
        __pruneFellowSeeds(90000);
      } catch (e) {}
    }, 30000);
    // Also try a vertical mesh channel if SEED defines one
    try {
      const mc = SEED.manifest.meshChannel;
      if (mc && mc !== 'fall-signal') {
        __meshChan2 = new BroadcastChannel(mc);
      }
    } catch (e) {}
    try { __wireCrossSeed(); } catch(_e){}
  } catch (e) { /* mesh optional */ }
}

window.__crossSeedHandlers = window.__crossSeedHandlers || {};

// Default introspect handler — every seed can describe itself
window.__crossSeedHandlers['introspect'] = async function() {

// Default records-export handler — list all entries from named IDB stores
window.__crossSeedHandlers['records-export'] = async function(payload) {
  const stores = (payload?.stores || []).filter(s => typeof s === 'string');
  const out = {};
  for (const s of stores) {
    try { out[s] = await idbGetAll(s); } catch(e) { out[s] = { error: e.message }; }
  }
  return { records: out, manifest: SEED.manifest, ts: Date.now() };
};

// Intercept fall-signal messages for request/response routing
// (extends __sigChan listener set up by initMesh)
function __wireCrossSeed() {
  if (!__sigChan) return;
  const origOnMsg = __sigChan.onmessage;
  __sigChan.onmessage = async (e) => {
    if (origOnMsg) try { origOnMsg(e); } catch(err) {}
    const m = e.data || {};
    if (!m.type) return;
    const self = __seedSelfInfo().source;
    if (m.type === 'request' && (m.to === self || m.to === '*') && m.from !== self) {
      const handler = window.__crossSeedHandlers[m.kind];
      if (!handler) return;
      try {
        const result = await handler(m.payload || {});
        __sigChan.postMessage({ type:'response', kind:m.kind, from:self, to:m.from, payload:result, reqId:m.reqId });
      } catch (err) {
        __sigChan.postMessage({ type:'response', kind:m.kind, from:self, to:m.from, payload:{ error: err.message }, reqId:m.reqId });
      }
    } else if (m.type === 'response' && m.to === self) {
      const pending = window.__crossSeedPending.get(m.reqId);
      if (pending) {
        clearTimeout(pending.timer);
        pending.resolve(m.payload);
        window.__crossSeedPending.delete(m.reqId);
      }
    }
  };
}

// Send a request to a specific peer (or all '*') and await response(s)
async function crossSeedRequest(targetSource, kind, payload, opts) {
  opts = opts || {};
  const timeoutMs = opts.timeoutMs || 3000;
  const reqId = 'r_' + Math.random().toString(36).slice(2,12);
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      window.__crossSeedPending.delete(reqId);
      reject(new Error('timeout'));
    }, timeoutMs);
    window.__crossSeedPending.set(reqId, { resolve, reject, timer });
    try {
      __sigChan.postMessage({
        type:'request', kind, from:__seedSelfInfo().source,
        to:targetSource, payload, reqId
      });
    } catch (e) {
      clearTimeout(timer);
      window.__crossSeedPending.delete(reqId);
      reject(e);
    }
  });
}
window.crossSeedRequest = crossSeedRequest;

      return { provider: p.id, text: out };
    } catch (e) {
      trace(`✗ ${p.name}: ${e.message}`, 'fail');
      lastErr = e;
    }
  }
  throw new Error('All providers failed. Last: ' + (lastErr?.message || 'unknown'));
}

async function callProvider(p, system, prompt, onChunk) {
  const cfg = state.providerConfig[p.id] || {};
  const model = cfg.customModel || p.model;
  if (p.id === 'webllm') {
    if (state.webllmStatus !== 'ready') throw new Error('WebLLM not loaded — click Load in Providers tab');
    const reply = await state.webllmEngine.chat.completions.create({
      messages: [{role:'system',content:system},{role:'user',content:prompt}],
      stream: true
    });
    let acc = '';
    for await (const chunk of reply) {
      const d = chunk.choices[0]?.delta?.content || '';
      acc += d; onChunk(d);
    }
    return acc;
  }
  if (p.id === 'google') {
    const url = p.endpoint + '?alt=sse&key=' + encodeURIComponent(cfg.key);
    const body = {
      systemInstruction: { parts: [{ text: system }] },
      contents: [{ role:'user', parts:[{ text: prompt }] }],
      generationConfig: { temperature: 0.4, maxOutputTokens: 4096 }
    };
    const r = await fetch(url, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body) });
    if (!r.ok) throw new Error('Google ' + r.status + ': ' + await r.text());
    return await streamSSE(r, onChunk, 'google');
  }
  if (p.id === 'anthropic') {
    const body = {
      model, max_tokens: 4096,
      stream: true,
      system,
      messages: [{ role:'user', content: prompt }]
    };
    const r = await fetch(p.endpoint, {
      method:'POST',
      headers:{'content-type':'application/json','x-api-key':cfg.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body: JSON.stringify(body)
    });
    if (!r.ok) throw new Error('Anthropic ' + r.status + ': ' + await r.text());
    return await streamSSE(r, onChunk, 'anthropic');
  }
  // OpenAI-compatible (groq, openrouter, cerebras, ollama, lmstudio)
  const body = { model, messages: [{role:'system',content:system},{role:'user',content:prompt}], stream: true, temperature: 0.4 };
  const headers = { 'content-type':'application/json' };
  if (cfg.key) headers['authorization'] = 'Bearer ' + cfg.key;
  const r = await fetch(p.endpoint, { method:'POST', headers, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(p.name + ' ' + r.status + ': ' + (await r.text()).slice(0,160));
  return await streamSSE(r, onChunk, 'openai');
}

async function streamSSE(response, onChunk, kind) {
  const reader = response.body.getReader();
  const dec = new TextDecoder();
  let buf = '', acc = '';
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split(/\r?\n/);
    buf = lines.pop() || '';
    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      const data = line.slice(6).trim();
      if (data === '[DONE]') continue;
      try {
        const j = JSON.parse(data);
        let d = '';
        if (kind === 'anthropic') {
          if (j.type === 'content_block_delta') d = j.delta?.text || '';
        } else if (kind === 'google') {
          d = j.candidates?.[0]?.content?.parts?.[0]?.text || '';
        } else {
          d = j.choices?.[0]?.delta?.content || '';
        }
        if (d) { acc += d; onChunk(d); }
      } catch (e) {}
    }
  }
  return acc;
}

// ═══════════════════════════════════════════════════════════════
// JS LITERAL · for Fork Seed packager
// ═══════════════════════════════════════════════════════════════
function jsLiteral(obj, indent=0) {
  const pad = '  '.repeat(indent);
  const padNext = '  '.repeat(indent+1);
  if (obj === null) return 'null';
  if (typeof obj === 'number' || typeof obj === 'boolean') return String(obj);
  if (typeof obj === 'string') {
    if (obj.length > 80 || obj.includes('\n')) return '`' + obj.replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/\$\{/g,'\\${') + '`';
    return "'" + obj.replace(/\\/g,'\\\\').replace(/'/g,"\\'") + "'";
  }
  if (Array.isArray(obj)) {
    if (!obj.length) return '[]';
    return '[\n' + obj.map(v => padNext + jsLiteral(v, indent+1)).join(',\n') + '\n' + pad + ']';
  }
  if (typeof obj === 'object') {
    const keys = Object.keys(obj);
    if (!keys.length) return '{}';
    return '{\n' + keys.map(k => padNext + (/^[a-zA-Z_$][a-zA-Z0-9_$]*$/.test(k) ? k : JSON.stringify(k)) + ': ' + jsLiteral(obj[k], indent+1)).join(',\n') + '\n' + pad + '}';
  }
  return 'null';
}

window.saveControl = async function(framework, code, title) {
  const status = $('#ecStatus').value;
  const owner  = $('#ecOwner').value.trim();
  const due    = $('#ecDue').value;
  const notes  = $('#ecNotes').value.trim();
  const recs = await idbGetAll('controls');
  let r = recs.find(x => x.framework === framework && x.controlCode === code);
  if (!r) r = { id: uid('ctl'), framework, controlCode: code, title, created: now() };
  Object.assign(r, { status, owner, due, notes, lastModified: now() });
  const chain = await chainNext({ kind:'control.update', id:r.id, status, owner });
  r.prevHash = chain.prevHash; r.hash = chain.hash;
  await idbPut('controls', r);
  meshBroadcast('control.updated', { id:r.id, framework, code, status });

  // ─── Cross-map writeback ───────────────────────────────────
  // If this control was marked evidenced or audited, auto-flag mapped controls
  // as "mappedcandidate" status (visually distinct purple pill) so the user
  // can see what work just got de-duplicated.
  let mappedCount = 0;
  if (status === 'evidenced' || status === 'audited') {
    const srcKey = `${framework}:${code}`;
    const mapping = SEED.crossMap.find(m => m.from === srcKey);
    if (mapping) {
      for (const targetKey of mapping.to) {
        const [tFw, tCode] = targetKey.split(':');
        if (!state.activeFrameworks.includes(tFw)) continue;
        let mr = recs.find(x => x.framework === tFw && x.controlCode === tCode);
        if (mr && (mr.status === 'evidenced' || mr.status === 'audited')) continue;
        if (!mr) {
          // find title from frameworks catalogue
          const fw = SEED.frameworks[tFw];
          const ctlDef = fw?.controls?.find(c => c.code === tCode);
          mr = { id: uid('ctl'), framework: tFw, controlCode: tCode, title: ctlDef?.title || tCode, created: now() };
        }
        mr.status = 'mappedcandidate';
        mr.mappedFrom = srcKey;
        mr.lastModified = now();
        mr.notes = (mr.notes ? mr.notes + '\n' : '') + `[auto] mapped from ${srcKey} (${status}) at ${new Date().toISOString()}`;
        const c = await chainNext({ kind:'control.crossmap', id:mr.id, mappedFrom:srcKey, status:mr.status });
        mr.prevHash = c.prevHash; mr.hash = c.hash;
        await idbPut('controls', mr);
        mappedCount++;
      }
    }
  }

  closeModal();
  toast(mappedCount ? `control saved · ${mappedCount} mapped control${mappedCount===1?'':'s'} flagged` : 'control saved');
  render();
};

window.doFellowPull = async function() {
  const target = $('#psTarget').value;
  const stores = $('#psStores').value.split(',').map(s=>s.trim()).filter(Boolean);
  const links = $('#psLinks').value.split(',').map(s=>s.trim()).filter(Boolean);
  if (!target || !stores.length) { toast('target + stores required', true); return; }
  closeModal();
  toast('sending request to ' + target + '…');
  try {
    const resp = await crossSeedRequest(target, 'records-export', { stores }, { timeoutMs: 5000 });
    const records = resp?.records || {};
    let totalImported = 0;
    for (const [storeName, entries] of Object.entries(records)) {
      if (!Array.isArray(entries)) continue;
      for (const entry of entries) {
        const title = `[${storeName}] ${entry.title || entry.name || entry.id || JSON.stringify(entry).slice(0,40)}`;
        const content = JSON.stringify(entry, null, 2);
        const contentHash = await sha256Hex(content);
        const item = {
          id: uid('ev'), type:'text', title,
          description: 'Imported via mesh from ' + target + ' / store: ' + storeName,
          content, contentHash, controlIds: links,
          capturedAt: now(), capturedBy: 'mesh-import',
          importedFrom: target
        };
        const c = await chainNext({kind:'evidence.import', id:item.id, from:target, store:storeName});
        item.prevHash = c.prevHash; item.hash = c.hash;
        await idbPut('evidence', item);
        totalImported++;
      }
    }
    toast(`✓ imported ${totalImported} record${totalImported===1?'':'s'} from ${target}`);
    render();
  } catch (e) {
    toast('pull failed: ' + e.message, true);
  }
};

window.saveEvidenceFile = async function() {
  const title = $('#evTitle').value.trim();
  const desc = $('#evDesc').value.trim();
  const links = $('#evLinks').value.split(',').map(s => s.trim()).filter(Boolean);
  const fInp = $('#evFile');
  const file = fInp.files[0];
  if (!title || !file) { toast('title and file required', true); return; }
  const buf = await file.arrayBuffer();
  const hashBuf = await crypto.subtle.digest('SHA-256', buf);
  const contentHash = Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2,'0')).join('');
  const b64 = btoa(String.fromCharCode(...new Uint8Array(buf)));
  const item = { id: uid('ev'), type:'file', title, description: desc, fileName: file.name, fileSize: file.size, fileMime: file.type, content: b64, contentHash, controlIds: links, capturedAt: now(), capturedBy: 'local' };
  const chain = await chainNext({ kind:'evidence.add', id:item.id, contentHash });
  item.prevHash = chain.prevHash; item.hash = chain.hash;
  await idbPut('evidence', item);
  closeModal();
  toast('evidence captured (' + Math.round(file.size/1024) + ' KB)');
  render();
};

// ─── GAP ANALYSIS ──────────────────────────────────────────────
async function renderGap(main) {
  const recs = await idbGetAll('controls');
  const byFw = {};
  for (const r of recs) {
    byFw[r.framework] = byFw[r.framework] || {};
    byFw[r.framework][r.controlCode] = r.status;
  }
  const blocks = [];
  for (const fwKey of state.activeFrameworks) {
    const f = SEED.frameworks[fwKey];
    if (!f || f.stub) continue;
    const total = f.controls.length;
    const counts = { pending:0, inprogress:0, implemented:0, evidenced:0, audited:0, na:0 };
    for (const c of f.controls) {
      const s = byFw[fwKey]?.[c.code] || 'pending';
      counts[s] = (counts[s]||0) + 1;
    }
    const done = counts.evidenced + counts.audited + counts.na;
    const pct = total ? Math.round(done * 100 / total) : 0;
    const missing = f.controls.filter(c => {
      const s = byFw[fwKey]?.[c.code] || 'pending';
      return s === 'pending' || s === 'inprogress';
    });
    blocks.push(`<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
        <h3>${esc(f.shortName)}</h3>
        <div style="font-family:var(--mono);font-size:12px;color:var(--brass)">${pct}% complete (${done}/${total})</div>
      </div>
      <div class="gap-bar"><div style="width:${pct}%"></div></div>
      <div style="display:flex;gap:14px;margin-top:14px;font-family:var(--mono);font-size:10px;color:var(--cream-muted);letter-spacing:.06em;flex-wrap:wrap">
        <span><span class="status-pill pending">${counts.pending}</span> pending</span>
        <span><span class="status-pill inprogress">${counts.inprogress}</span> in progress</span>
        <span><span class="status-pill implemented">${counts.implemented}</span> implemented</span>
        <span><span class="status-pill evidenced">${counts.evidenced}</span> evidenced</span>
        <span><span class="status-pill audited">${counts.audited}</span> audited</span>
        <span><span class="status-pill na">${counts.na}</span> n/a</span>
      </div>
      ${missing.length ? `<details style="margin-top:14px"><summary style="cursor:pointer;font-size:12px;color:var(--cream-dim)">${missing.length} controls still to close →</summary>
        <div style="margin-top:10px">${missing.slice(0,40).map(c => `<div style="padding:4px 0;font-size:11px;font-family:var(--mono);color:var(--cream-dim)"><span style="color:var(--brass)">${esc(c.code)}</span> · ${esc(c.title)}</div>`).join('')}${missing.length>40?`<div style="font-size:11px;color:var(--cream-muted);margin-top:6px">… and ${missing.length-40} more</div>`:''}</div>
      </details>` : '<div style="margin-top:14px;color:var(--green);font-family:var(--mono);font-size:11px">✓ all controls past in-progress</div>'}
    </div>`);
  }
  main.innerHTML = `
    <div class="section-h"><h2>Gap analysis</h2><div class="sub">${state.activeFrameworks.length} framework${state.activeFrameworks.length===1?'':'s'}</div></div>
    ${blocks.join('') || '<div class="empty-state">activate a non-stub framework to see gap analysis</div>'}
  `;
}

      <p style="font-size:12px;color:var(--cream-dim);margin-bottom:10px">Edit the SEED constant below. When you click <em>Fork into HTML</em>, the packager fetches this very file, swaps the SEED_DEFAULT block, and downloads the mutated child as a new self-contained HTML file. The child carries the same build engine + packager — your fork is itself a forkable seed.</p>
      <textarea id="pkgJson" rows="20" style="font-family:var(--mono);font-size:11px">${esc(JSON.stringify(state.pkgDraft, null, 2))}</textarea>
      <div style="display:flex;gap:8px;margin-top:10px">

        <button class="btn sm ghost" onclick="state.pkgDraft = JSON.parse(JSON.stringify(SEED_DEFAULT)); render()">reset to default</button>

      </div>
    </div>
  `;

}
async function forkSeed() {
  let draft;
  try { draft = JSON.parse($('#pkgJson').value); } catch (e) { toast('invalid JSON: ' + e.message, true); return; }
  const currentHtml = await (await fetch(location.href, { cache:'reload' })).text();
  const seedStart = currentHtml.indexOf('const SEED_DEFAULT = {');
  if (seedStart < 0) { toast('cannot find SEED_DEFAULT in source', true); return; }
  let depth = 0, end = -1;
  for (let i = seedStart + 'const SEED_DEFAULT = '.length; i < currentHtml.length; i++) {
    if (currentHtml[i] === '{') depth++;
    else if (currentHtml[i] === '}') { depth--; if (depth === 0) { end = i + 1; break; } }
  }
  if (end < 0) { toast('cannot parse SEED_DEFAULT', true); return; }
  while (end < currentHtml.length && currentHtml[end] === ' ') end++;
  if (currentHtml[end] === ';') end++;
  const newLiteral = 'const SEED_DEFAULT = ' + jsLiteral(draft) + ';';
  const newHtml = currentHtml.slice(0, seedStart) + newLiteral + currentHtml.slice(end);
  // download
  const blob = new Blob([newHtml], { type:'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const slug = (draft.manifest?.name || 'compliance').replace(/[^a-z0-9]+/gi,'-');
  a.href = url; a.download = 'fallseed-' + slug + '-fork.html'; a.click();
  URL.revokeObjectURL(url);
  toast('forked into HTML · saved');
}
